# Projet Xcode généré avec XcodeGen :  brew install xcodegen && xcodegen
name: TrackMyThings
options:
  bundleIdPrefix: biz.besnard
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # ⬇️ À personnaliser : votre Team ID Apple (visible dans Xcode > Settings > Accounts)
    DEVELOPMENT_TEAM: ""
    # ⬇️ Identifiant : changez-le s'il est déjà pris (« bundle identifier not available »)
    BASE_BUNDLE_ID: biz.besnard.trackmythings

targets:
  TrackMyThings:
    type: application
    platform: iOS
    sources: [App]
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TrackMyThings
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
