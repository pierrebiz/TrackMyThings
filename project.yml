# Projet Xcode généré avec XcodeGen :  brew install xcodegen && xcodegen
name: TrackMyThings
options:
  bundleIdPrefix: biz.besnard
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # ⬇️ À personnaliser : votre Team ID Apple (visible dans Xcode > Settings > Accounts)
    DEVELOPMENT_TEAM: ""
    # ⬇️ Identifiants : changez-les s'ils sont déjà pris (« bundle identifier not available »)
    BASE_BUNDLE_ID: biz.besnard.trackmythings
    APP_GROUP_ID: group.biz.besnard.trackmythings

targets:
  TrackMyThings:
    type: application
    platform: iOS
    sources: [App, Shared]
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TrackMyThings
        AppGroupID: $(APP_GROUP_ID)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [trackmythings]
    entitlements:
      path: App/TrackMyThings.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    dependencies:
      - target: TrackWidget

  TrackWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).widget
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: TrackMyThings
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/TrackWidget.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
