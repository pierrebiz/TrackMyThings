name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild \
            -project TrackMyThings.xcodeproj \
            -scheme TrackMyThings \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log | grep -E "error:|warning: .*(deprecated|Sendable)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Package IPA (ad-hoc signed with App Group entitlements)
        run: |
          GROUP=$(grep -E '^\s+APP_GROUP_ID:' project.yml | head -1 | awk '{print $2}')
          cat > ent.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.application-groups</key><array><string>${GROUP}</string></array>
          </dict></plist>
          PLIST
          APP=build/Build/Products/Release-iphoneos/TrackMyThings.app
          codesign -f -s - --entitlements ent.plist "$APP/PlugIns/TrackWidget.appex"
          codesign -f -s - --entitlements ent.plist "$APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry TrackMyThings.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TrackMyThings-ipa
          path: TrackMyThings.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
